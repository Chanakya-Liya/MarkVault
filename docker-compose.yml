# NOTE: Enable "Start Docker Desktop on login" in Docker Desktop settings
# (Windows: Settings → General) so MarkVault auto-starts on boot.

services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/markvault.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
